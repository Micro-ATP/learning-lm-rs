[package]
name = "learning-lm-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.4.3"
tokenizers = "0.19.1"
rand = "0.8"
libloading = "0.8"

# GPU支持 - 使用Metal Performance Shaders
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.27"
objc = "0.2"
core-foundation = "0.9"

# GPU支持 - 使用CUDA (使用更简单的绑定)
[target.'cfg(windows)'.dependencies]
cuda-sys = "0.2"